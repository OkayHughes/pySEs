name: fast tests

# WHEN this runs. These triggers only control *running*; they do NOT make CI a
# required gate. Blocking merges is a separate opt-in (GitHub branch-protection
# "required status checks"), which we are intentionally leaving OFF. So this
# reports pass/fail on every push and PR but never stops you committing to main.
on:
  push:
    branches: [main]
  pull_request:

# If you push twice in quick succession, cancel the older in-flight run for the
# same branch/PR instead of paying for both. Purely a cost/speed nicety.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      # One job per backend, run in parallel. fail-fast: false means a failure
      # in (say) torch does NOT cancel the numpy and jax jobs -- you get an
      # independent green/red check for each backend.
      fail-fast: false
      matrix:
        backend: [numpy, jax, torch]

    name: fast tests (${{ matrix.backend }})

    steps:
      - uses: actions/checkout@v4

      # Installs the `uv` package manager and a Python matching .python-version
      # (3.13). enable-cache reuses downloaded wheels between runs (torch/jax
      # are large), so subsequent runs are much faster.
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Creates .venv and installs the project + its deps (numpy, jax, torch are
      # all core dependencies) plus the dev group (pytest), from the repo root.
      - name: Install dependencies
        run: uv sync

      # Reuses your existing matrix runner for ONE backend. It already sets the
      # right per-backend env (e.g. PYSES_JIT_COMPILE=0 for torch). --exclude-slow
      # skips test_run_model.py and shallow_water_tests. It exits non-zero on any
      # test failure, which surfaces as a red X on this job.
      - name: Run fast tests (${{ matrix.backend }})
        run: uv run python run_test_matrix.py ${{ matrix.backend }} --exclude-slow
